<!DOCTYPE html>
<html>
    <head>
        <title>Corpo-speak and how to respond</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="styleseet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,100..900&family=Black+Ops+One&family=Eagle+Lake&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Orbitron:wght@400..900&family=Special+Elite&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container-fluid main-content">
            <h1>Meaningless Buzzwords - and how to respond!</h1>
            <div class="row">
                <div class="col-md-6" id="get-buzzwords">
                    <h2>Here's some meaningless corpo-speak:</h2>
                    <h3 id="buzzwords">Press the button below to get some buzzwords!</h3>
                    <button id="get-buzzwords-button">BUZZWORDS</button>
                </div>
                <div class="col-md-6" id="insult-generator">
                    <h2>Get a response to that meaningless jargon:</h2>
                    <h3 id="insult-generated">Press the button to get an insult!</h3>
                    <button id="get-insult-button">INSULT</button>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
